name: Fetch climate data and Commit
on:
  schedule: [{cron: '0 0 * * *'}]
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python update_climate.py
      - name: Set commit date
        run: echo "COMMIT_DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update API data ${{ env.COMMIT_DATE }}"
          file_pattern: "GLB.Ts+dSST.csv"
