name: Fetch climate data and Commit
on:
  schedule: [{cron: '0 0 * * *'}]
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python update_climate.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update API data ($(date -u +'%Y-%m-%d'))"
          file_pattern: "GLB.Ts+dSST.csv"
